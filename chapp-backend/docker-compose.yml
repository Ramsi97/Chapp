services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network, reach Mongo by its service name.
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    volumes:
      # Persist uploaded media across container rebuilds.
      - ./uploads:/app/uploads

volumes:
  mongo_data:
